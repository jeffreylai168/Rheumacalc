   Version tab bars for grouped criteria
--------------------------------------------------------- */
CALC_GROUPS.forEach(g=>{
  g.members.forEach(([mid])=>{
    const header = document.querySelector('#panel-'+mid+' .calc-header');
    if(!header) return;
    const bar = document.createElement('div');
    bar.className = 'group-tabs'; bar.setAttribute('role','tablist');
    g.members.forEach(([tid,label])=>{
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'group-tab'+(tid===mid?' active':''); b.textContent = label;
      b.setAttribute('role','tab'); b.setAttribute('aria-selected', tid===mid ? 'true':'false');
      b.addEventListener('click', ()=>{ if(tid!==activeId) showCalc(tid); });
      bar.appendChild(b);
    });
    header.after(bar);
  });
});

const UX = (function(){
  const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));

  /* ---------- number helpers ---------- */
  function toNum(s){ return +String(s).replace(/[−–]/g,'-').replace(/\s+/g,''); }
  function fmtNum(n){ return String(Math.round(n*100)/100); }
  function signed(n){ return n>0 ? '+'+fmtNum(n) : (n<0 ? '−'+fmtNum(-n) : '0'); }
  function signedStr(raw){           /* keeps published decimals, e.g. "1.0" → "+1.0" */
    const s = String(raw).replace(/\s+/g,'').replace(/[−–]/g,'-');
    const v = toNum(s), body = s.replace(/^[+-]/,'');
    return v>0 ? '+'+body : (v<0 ? '−'+body : '0');
  }
  function fire(el){
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true}));
  }

  /* ---------- point rules not written in the option text ----------
     Each one mirrors the calculator's own scoring code exactly.   */
  const iimWB = ()=> (window._iim17Mode||'nb')==='wb';
  const OPT_PTS = {
    'iim17-age': v => ({lt18:0, '18-40': iimWB()?1.5:1.3, ge40: iimWB()?2.2:2.1})[v] || 0,  /* = iim17Calc */
    'lnpath-ai-necrosis':  v => (+v||0)*2,                                                   /* = lnpathCalc ×2 */
    'lnpath-ai-crescents': v => (+v||0)*2,
    'cdasi-gh-ery': v => (+v||0) * (document.getElementById('cdasi-gh-papules').checked ? 2 : 1), /* = cdasiCalc */
  };
  ESSDAI_DOMAINS.forEach(d=>{ OPT_PTS['essdai-'+d.id] = v => (+v||0)*(window._essdaiTab==='clin' ? d.clinW : d.weight); });   /* = essdaiCalc (ESSDAI or ClinESSDAI tab) */
  const CHK_PTS = {
    'clasi-hairloss': ()=>1,     /* clasiCalc: act += hairloss ? 1 : 0 */
    'cdasi-alopecia': ()=>1,     /* cdasiCalc: act += alopecia ? 1 : 0 */
  };
  IIM17_ITEMS.forEach(it=>{ CHK_PTS['iim17-'+it.id] = ()=> it.w[iimWB()?'wb':'nb']; });    /* = iim17Calc */
  const FIELDSET_MAX = new Set(['spa26-mri','spa26-xray']);   /* spa26Calc: imaging = higher of MRI / X-ray */

  /* ---------- entry / applicability requirements that exist only as text ---------- */
  const ENTRY_INFO = {
    acreular2010: ['Target population (entry requirement)', '≥1 joint with definite clinical synovitis (swelling), not better explained by another disease.'],
    gpa2022:      ['Applicability requirement', 'Applies once a diagnosis of small/medium-vessel vasculitis has been established and mimics excluded.'],
    mpa2022:      ['Applicability requirement', 'Applies once a diagnosis of small/medium-vessel vasculitis has been established and mimics excluded.'],
    egpa2022:     ['Applicability requirement', 'Applies once a diagnosis of small/medium-vessel vasculitis has been established and mimics excluded.'],
    pan1990:      ['Applicability requirement', 'For use in a patient in whom a vasculitis diagnosis has already been established.'],
  };
  const RX_ENTRY_LABEL = /entry|absolute requirement|mandatory|required to apply|sufficient criterion/i;
  const DOM_TITLE_PANELS = ['sle2019','aps2023','assd2025','lnpath','essdai','bvas','mrss','pmr2012','gout2015','mctd'];   /* larger domain titles */
  const NO_GRID_PANELS = ['caspar','cress','ffs'];                                             /* one multi-select item per row */

  /* ---------- option-text parsing ---------- */
  const RX_TRAIL = /\s*\(\s*([+\-−–]?\s*\d+(?:\.\d+)?)\s*(?:pts?|points?)?\s*\)\s*$/i;  /* "Fever (2)", "(1 pt)", "(+1)" */
  const RX_LEAD  = /^(\d+(?:\.\d+)?)\s+[—–-]\s+(.+)$/;                                  /* "2 — moderate (25–50%)" */
  const RX_NUM   = /^\d+(?:\.\d+)?$/;                                                   /* "2" */
  const RX_GRADE = /^([A-E])\s+[—–-]\s+(.+)$/;                                          /* "B — moderate activity" */
  const RX_WSPAN = /^\(\s*([+\-−–]?\s*\d+(?:\.\d+)?)\s*(?:pts?|points?)?\s*(?:,\s*([\s\S]*?))?\)$/i;
  function parseOpt(t, short){
    t = t.replace(/\s+/g,' ').trim();
    let m;
    if((m=t.match(RX_TRAIL))) return {txt:t.replace(RX_TRAIL,'').trim(), pts:toNum(m[1]), ptsStr:m[1], short:t};
    if((m=t.match(RX_LEAD)))  return {txt: short ? t.split(':')[0] : t, pts:toNum(m[1]), ptsStr:m[1], short:m[1]};
    if(RX_NUM.test(t))        return {txt:t, pts:toNum(t), ptsStr:t, short:t};
    if((m=t.match(RX_GRADE))) return {txt:m[2], grade:m[1], short:m[1]};
    return {txt:t, short:t.split(/\s+[—–-]\s+/)[0]};
  }

  /* ---------- <select> → option buttons ---------- */
  function enhanceSelect(sel){
    if(sel.dataset.ux) return; sel.dataset.ux = '1';
    const opts = Array.from(sel.options);
    if(opts.length===11 && opts.every((o,i)=>o.value===String(i))) return enhanceSlider(sel);
    const inTable = !!sel.closest('table');
    const short = sel.dataset.uxShort==='1';
    const parsed = opts.map(o=>parseOpt(o.textContent, short));
    const rule = OPT_PTS[sel.id];
    const hasPts = !!rule || parsed.some(p=>p.pts!==undefined);
    const field = sel.closest('.field');
    const lbl = field ? field.querySelector(':scope > label') : null;
    const row = document.createElement('div');
    row.className = 'opt-row' + (inTable ? ' compact' : (opts.length>=4 ? ' four' : (parsed.some(p=>(p.txt||'').length>48) ? ' long' : '')));
    row.setAttribute('role','radiogroup');
    if(lbl) row.setAttribute('aria-label', lbl.textContent.trim());
    const btns = opts.map((o,i)=>{
      const p = parsed[i];
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt-btn'; b.setAttribute('role','radio');
      if(inTable){ b.textContent = p.short; b.title = o.textContent.trim(); }
      else {
        const t = document.createElement('span'); t.className = 'opt-txt';
        if(p.grade){ const g = document.createElement('b'); g.className = 'opt-grade'; g.textContent = p.grade; t.append(g, ' — '+p.txt); }
        else t.textContent = p.txt;
        if(short) b.title = o.textContent.trim();
        b.appendChild(t);
        if(hasPts){ const c = document.createElement('b'); c.className = 'pts'; b.appendChild(c); }
      }
      b.addEventListener('click', ()=>{
        if(sel.selectedIndex!==i){ sel.selectedIndex = i; fire(sel); }
        sync(sel.closest('.panel'));
      });
      row.appendChild(b);
      return b;
    });
    sel.classList.add('ux-hidden'); sel.tabIndex = -1; sel.setAttribute('aria-hidden','true');
    if(getComputedStyle(sel.parentElement).position==='static') sel.parentElement.style.position = 'relative';
    sel.after(row);
    if(field && !inTable && !sel.closest('#bicla-domains')) field.classList.add('ux-wide');
    sel._ux = {kind:'select', btns, parsed, rule, hasPts, inTable};
  }
  function optPts(sel, i){
    const u = sel._ux;
    if(u.rule) return u.rule(sel.options[i].value);
    return u.parsed[i].pts;
  }
  function selPts(sel){ return optPts(sel, sel.selectedIndex) || 0; }

  /* ---------- 0–10 integer <select> → slider (MMT8) ---------- */
  function enhanceSlider(sel){
    const field = sel.closest('.field');
    const lbl = field ? field.querySelector(':scope > label') : null;
    const wrap = document.createElement('div'); wrap.className = 'ux-slider';
    const row = document.createElement('div'); row.className = 'range-row';
    const col = document.createElement('div'); col.style.flex = '1';
    const r = document.createElement('input');
    r.type = 'range'; r.min = '0'; r.max = '10'; r.step = '1'; r.value = sel.value;
    if(lbl) r.setAttribute('aria-label', lbl.textContent.trim());
    const ticks = document.createElement('div'); ticks.className = 'ux-ticks';
    for(let i=0;i<=10;i++){ const s = document.createElement('span'); s.textContent = i; s.style.width='16px'; s.style.textAlign='center'; ticks.appendChild(s); }
    ticks.style.padding = '0';
    col.append(r, ticks);
    const val = document.createElement('span'); val.className = 'val';
    row.append(col, val); wrap.appendChild(row);
    r.addEventListener('input', ()=>{
      const v = String(Math.max(0, Math.min(10, Math.round(+r.value))));
      if(sel.value!==v){ sel.value = v; fire(sel); }
      sync(sel.closest('.panel'));
    });
    sel.classList.add('ux-hidden'); sel.tabIndex = -1; sel.setAttribute('aria-hidden','true');
    if(getComputedStyle(sel.parentElement).position==='static') sel.parentElement.style.position = 'relative';
    sel.after(wrap);
    sel._ux = {kind:'slider', r, val};
  }

  /* ---------- checkbox → toggle button ---------- */
  function enhanceCheckbox(cb){
    if(cb.dataset.ux) return; cb.dataset.ux = '1';
    const wrap = cb.closest('.check-item');
    const label = cb.id ? document.querySelector('label[for="'+cb.id+'"]') : null;
    if(!wrap || !label) return;
    wrap.classList.add('ux-toggle');
    if(/yellow-bg/.test(wrap.getAttribute('style')||'')){
      wrap.classList.add(RX_ENTRY_LABEL.test(label.textContent) ? 'ux-entry' : 'ux-flag');
      wrap.style.background = ''; wrap.style.padding = ''; wrap.style.borderRadius = '';
    }
    cb.classList.add('ux-hidden');
    const box = document.createElement('span'); box.className = 'ux-box'; box.setAttribute('aria-hidden','true');
    const txt = document.createElement('span'); txt.className = 'ux-lbl';
    while(label.firstChild) txt.appendChild(label.firstChild);
    label.append(box, txt);
    let ptsStr = null;
    txt.querySelectorAll('span.w, span.hint').forEach(sp=>{
      if(ptsStr!==null) return;
      const m = sp.textContent.trim().match(RX_WSPAN);
      if(!m) return;
      ptsStr = m[1];
      if(m[2] && m[2].trim()){ sp.className = 'w'; sp.textContent = '('+m[2].trim()+')'; } else sp.remove();
    });
    const rule = CHK_PTS[cb.id];
    let chip = null;
    if(ptsStr!==null || rule){ chip = document.createElement('b'); chip.className = 'pts'; label.appendChild(chip); }
    cb._ux = {kind:'check', wrap, chip, ptsStr, rule};
  }
  function chkPts(cb){
    const u = cb._ux;
    if(!u) return null;
    if(u.rule) return u.rule();
    return u.ptsStr!==null ? toNum(u.ptsStr) : null;
  }

  /* runs of ≥4 short multi-select toggles → 2–3 columns (long items keep a full row) */
  function groupShortToggles(panel){
    if(NO_GRID_PANELS.includes(panel.id.replace('panel-',''))) return;
    const parents = new Set($$('.check-item.ux-toggle', panel).map(t=>t.parentElement));
    parents.forEach(par=>{
      if(/columns/.test(par.getAttribute('style')||'') || par.classList.contains('ux-toggle-grid')) return;
      let run = [];
      const flush = ()=>{
        const isLong = t=>t.textContent.replace(/\s+/g,' ').trim().length>90;
        if(run.length>=4 && run.filter(t=>!isLong(t)).length>=3){
          const g = document.createElement('div'); g.className = 'ux-toggle-grid';
          run[0].before(g); run.forEach(t=>{ if(isLong(t)) t.classList.add('ux-span'); g.appendChild(t); });
        }
        run = [];
      };
      Array.from(par.children).forEach(ch=>{
        if(ch.classList.contains('ux-toggle') && !ch.classList.contains('ux-entry') && !ch.classList.contains('ux-flag')) run.push(ch); else flush();
      });
      flush();
    });
  }

  /* ---------- existing tile groups (APS, SSc, BVAS, ASyS) ---------- */
  function enhanceTileGroup(g){
    if(g.dataset.ux) return; g.dataset.ux = '1';
    const tiles = $$('.tile', g);
    if(tiles.length>=4) g.classList.add('four');
    else if(tiles.some(t=>(t.firstElementChild ? t.firstElementChild.textContent : '').length>48)) g.classList.add('long');
    g.setAttribute('role','radiogroup');
    tiles.forEach(t=>{
      t.tabIndex = 0; t.setAttribute('role','radio');
      t.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); t.click(); } });
      const p = t.querySelector('.tile-pts');
      if(p) p.classList.toggle('zero', toNum(p.textContent)===0);
    });
  }
  function tilePts(g){ const a = g.querySelector('.tile.active'); return a ? (+a.dataset.val||0) : 0; }

  /* ---------- live domain-subtotal badges ---------- */
  const badges = [];
  function addBadge(anchor, compute, format){
    if(!anchor) return;
    const el = document.createElement('span'); el.className = 'dom-badge';
    anchor.appendChild(el);
    badges.push({panel:anchor.closest('.panel'), el, compute, format});
  }
  function pointItems(scope){
    const out = [];
    $$('select', scope).forEach(sel=>{ const u = sel._ux; if(u && u.kind==='select' && !u.inTable && u.hasPts) out.push({id:sel.id, val:()=>selPts(sel)}); });
    $$('input[type=checkbox]', scope).forEach(cb=>{ const u = cb._ux; if(u && (u.ptsStr!==null || u.rule)) out.push({id:cb.id, val:()=>cb.checked ? chkPts(cb) : 0}); });
    $$('.tile-group', scope).forEach(g=>{ if(g.querySelector('.tile-pts')) out.push({id:g.id, val:()=>tilePts(g)}); });
    return out;
  }
  function buildBadges(panel){
    /* one domain = one single-choice select */
    $$('select', panel).forEach(sel=>{
      const u = sel._ux; if(!u || u.kind!=='select' || u.inTable || !u.hasPts) return;
      const field = sel.closest('.field'); if(!field || field.querySelectorAll('select').length!==1) return;
      addBadge(field.querySelector(':scope > label'), ()=>selPts(sel));
    });
    /* one domain = one tile group */
    $$('.tile-group', panel).forEach(g=>{
      if(!g.querySelector('.tile-pts')) return;
      addBadge(g.parentElement.querySelector(':scope > label'), ()=>tilePts(g));
    });
    /* one domain = one fieldset of point-bearing items (sum, or highest-only) */
    $$('fieldset', panel).forEach(fs=>{
      const lg = fs.querySelector(':scope > legend'); if(!lg) return;
      const items = pointItems(fs); if(!items.length) return;
      const isMax = items.some(it=>FIELDSET_MAX.has(it.id));
      addBadge(lg, ()=>{ const v = items.map(it=>it.val()||0); return isMax ? Math.max(0,...v) : v.reduce((a,b)=>a+b,0); });
    });
    /* score-sheet tables: column totals */
    $$('table', panel).forEach(table=>{
      if(table.dataset.ux || !table.querySelector('select') || !table.tHead || table.querySelector('td[colspan]')) return;
      table.dataset.ux = '1';
      const n = table.tHead.rows[0].cells.length;
      const tr = table.createTFoot().insertRow();
      for(let c=0;c<n;c++){
        const td = tr.insertCell();
        if(c===0){ td.textContent = 'Column total'; continue; }
        const sels = Array.from(table.tBodies[0].rows).map(r=>r.cells[c] && r.cells[c].querySelector('select')).filter(Boolean);
        if(!sels.length) continue;
        addBadge(td, ()=>sels.reduce((s,x)=>s+(isFinite(+x.value) ? +x.value : 0),0), v=>'Σ '+fmtNum(v));
      }
    });
  }
  function buildCustomBadges(){
    const q = id=>document.getElementById(id);
    /* IgG4-RD 2019 — number-input domains, scored by the calculator's own point functions */
    const iggLbl = txt=>$$('#panel-igg4rd2019 .field.full > label').find(l=>l.textContent.trim().startsWith(txt));
    addBadge(iggLbl('Immunostaining'), ()=>iggImmunoPoints(+q('igg-ratio').value||0, +q('igg-cells').value||0));
    addBadge(iggLbl('Serum IgG4'), ()=>iggSerumPoints(+q('igg-serumval').value||0, +q('igg-uln').value||201));
    /* APS 2023 D8 — read back the value apsCalc itself just computed */
    addBadge($$('#panel-aps2023 .field.full > label').find(l=>l.textContent.trim().startsWith('D8')), ()=>+((q('aps-d8-pill').textContent.match(/:\s*(-?\d+)/)||[0,0])[1]));
    /* Gout 2015 — episode characteristics (1 point each, = goutCalc) and tophus */
    addBadge(q('gout-ery').closest('.field').querySelector(':scope > label'), ()=>['gout-ery','gout-touch','gout-walk'].filter(id=>q(id).checked).length);
    addBadge(q('gout-tophus').closest('.field').querySelector(':scope > label'), ()=>q('gout-tophus').checked ? 4 : 0);
    /* ASyS 2025 — joint involvement domain (= assdCalc: joint ? 1.0 : 0) */
    addBadge(q('assd-joint').closest('.field').querySelector(':scope > label'), ()=>q('assd-joint').checked ? 1 : 0);
    /* SSc 2013 — grouped items with a fixed maximum (= sscCalc) */
    addBadge(q('ssc-pah').closest('.field').querySelector(':scope > label'), ()=>(q('ssc-pah').checked || q('ssc-ild').checked) ? 2 : 0);
    addBadge(q('ssc-aca').closest('.field').querySelector(':scope > label'), ()=>(q('ssc-aca').checked || q('ssc-scl70').checked || q('ssc-rnap3').checked) ? 3 : 0);
  }

  /* ---------- entry / absolute criteria styling ---------- */
  function markEntryFieldsets(root){
    $$('fieldset', root).forEach(fs=>{
      const lg = fs.querySelector(':scope > legend');
      if(lg && /^(entry|mandatory|prerequisite)/i.test(lg.textContent.trim())){ fs.classList.add('ux-entry-fs'); fs.style.borderColor = ''; }
    });
  }
  function addEntryInfo(){
    Object.entries(ENTRY_INFO).forEach(([id,[title,text]])=>{
      const hdr = document.querySelector('#panel-'+id+' .calc-header');
      if(!hdr || (hdr.nextElementSibling && hdr.nextElementSibling.classList.contains('ux-entry-info'))) return;
      const d = document.createElement('div'); d.className = 'ux-entry-info';
      const b = document.createElement('b'); b.textContent = title+': ';
      const n = document.createElement('span'); n.className = 'ux-note'; n.textContent = 'Confirm before applying the criteria — this requirement is not scored by the calculator below.';
      d.append(b, text, n);
      hdr.after(d);
    });
  }

  /* ---------- sync visual state ← native controls ---------- */
  function sync(panel){
    if(!panel) return;
    $$('select', panel).forEach(sel=>{
      const u = sel._ux; if(!u) return;
      if(u.kind==='slider'){
        u.r.value = sel.value;
        const t = sel.options[sel.selectedIndex].textContent.trim();
        u.val.innerHTML = '';
        const b = document.createElement('b'); b.className = 'pts'; b.style.fontSize = '14px'; b.textContent = sel.value;
        u.val.append(b, t.replace(/^\d+/,''));
        return;
      }
      const si = sel.selectedIndex;
      u.btns.forEach((b,i)=>{
        const on = i===si;
        b.classList.toggle('active', on); b.setAttribute('aria-checked', on ? 'true' : 'false');
        if(u.hasPts && !u.inTable){
          const c = b.querySelector('.pts'); const v = optPts(sel,i) || 0;
          c.textContent = (!u.rule && u.parsed[i].ptsStr!==undefined) ? signedStr(u.parsed[i].ptsStr) : signed(v);
          c.classList.toggle('zero', v===0);
        }
      });
    });
    $$('input[type=checkbox]', panel).forEach(cb=>{
      const u = cb._ux; if(!u) return;
      u.wrap.classList.toggle('on', cb.checked);
      if(u.chip){ const v = chkPts(cb) || 0; u.chip.textContent = u.rule ? signed(v) : signedStr(u.ptsStr); u.chip.classList.toggle('zero', v===0); }
    });
    $$('.tile-group .tile', panel).forEach(t=>t.setAttribute('aria-checked', t.classList.contains('active') ? 'true' : 'false'));
    badges.forEach(bd=>{
      if(bd.panel!==panel) return;
      const v = bd.compute() || 0;
      bd.el.textContent = bd.format ? bd.format(v) : signed(v)+' pts';
      bd.el.classList.toggle('zero', v===0);
    });
  }

  /* ---------- init ---------- */
  const panels = $$('.panel');
  panels.forEach(p=>{
    /* repeated long scales (e.g. mRSS ×17) show a short label; full text stays as a tooltip */
    const sig = {};
    $$('select', p).forEach(s=>{ const k = Array.from(s.options).map(o=>o.textContent).join('|'); (sig[k] = sig[k] || []).push(s); });
    Object.entries(sig).forEach(([k,list])=>{ if(list.length>=6 && k.includes(':')) list.forEach(s=>s.dataset.uxShort = '1'); });
    markEntryFieldsets(p);
    $$('select', p).forEach(enhanceSelect);
    $$('input[type=checkbox]', p).forEach(enhanceCheckbox);
    groupShortToggles(p);
    const sjGrid = p.querySelector('.ux-toggle-grid #sj-s1');
    if(sjGrid){ const g = sjGrid.closest('.ux-toggle-grid'); g.classList.add('ux-sj-score'); g.querySelectorAll('.ux-span').forEach(t=>t.classList.remove('ux-span')); }
    if(DOM_TITLE_PANELS.includes(p.id.replace('panel-',''))){
      p.querySelectorAll('.field > label, fieldset > legend, td.mrss-area').forEach(el=>{
        if(el.closest('.check-item') || el.closest('.field .grid')) return;   /* skip sub-fields, e.g. APS D8 titer boxes */
        el.classList.add('ux-dom-title');
      });
    }
    $$('.tile-group', p).forEach(enhanceTileGroup);
    buildBadges(p);
  });
  buildCustomBadges();
  addEntryInfo();
  panels.forEach(sync);
  ['change','input','click'].forEach(ev=>document.addEventListener(ev, e=>{
    const p = e.target && e.target.closest ? e.target.closest('.panel') : null;
    if(p) sync(p);
  }));

  return {sync, selPts, chkPts, tilePts, badges};
})();


/* =========================================================
   RESET — one "↺ 重設 Reset" button per calculator.
   Snapshots every control's initial state right after page
   load, and on reset restores only what changed, firing the
   same events a user click would, so each calculator's own
   scoring code recomputes normally. The chosen mode/tab
   (e.g. ESR vs CRP, with vs without biopsy) is kept.
========================================================= */
const RESET = (function(){
  const snaps = {};
  function snapshot(panel){
    const q = sel=>Array.from(panel.querySelectorAll(sel));
    return {
      sel:  q('select').map(el=>[el, el.selectedIndex]),
      chk:  q('input[type=checkbox]').map(el=>[el, el.checked]),
      inp:  q('input[type=number], input[type=range], input[type=text]').filter(el=>!el.readOnly && !el.closest('.ux-slider')).map(el=>[el, el.value]),
      tiles:q('.tile-group').map(g=>[g, Array.from(g.querySelectorAll('.tile')).findIndex(t=>t.classList.contains('active'))]),
      tgl:  q('.bilag-toggle').map(b=>[b, b.dataset.checked]),
      grp:  q('.bilag-seg2, .bilag-seg, .bilag-choice-list').map(g=>[g, Array.from(g.querySelectorAll('button')).findIndex(b=>b.classList.contains('active'))]),
    };
  }
  function fire(el){
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true}));
  }
  function reset(id){
    const panel = document.getElementById('panel-'+id), s = snaps[id];
    if(!panel || !s) return;
    s.sel.forEach(([el,i])=>{ if(el.selectedIndex!==i){ el.selectedIndex = i; fire(el); } });
    s.chk.forEach(([el,c])=>{ if(el.checked!==c){ el.checked = c; fire(el); } });
    s.inp.forEach(([el,v])=>{ if(el.value!==v){ el.value = v; fire(el); } });
    s.tiles.forEach(([g,i])=>{ const t = g.querySelectorAll('.tile')[i]; if(t && !t.classList.contains('active')) t.click(); });
    s.tgl.forEach(([b,v])=>{ if(b.dataset.checked!==v) b.click(); });
    s.grp.forEach(([g,i])=>{ const b = g.querySelectorAll('button')[i]; if(b && !b.classList.contains('active')) b.click(); });
    if(window.UX) UX.sync(panel);
    const btn = panel.querySelector('.reset-btn');
    if(btn){ btn.classList.add('done'); btn.textContent = '✓ 已重設 Cleared'; setTimeout(()=>{ btn.classList.remove('done'); btn.textContent = '↺ 重設 Reset'; }, 1200); }
  }
  CALCS.forEach(c=>{
    const panel = document.getElementById('panel-'+c.id); if(!panel) return;
    snaps[c.id] = snapshot(panel);
    const back = panel.querySelector('.calc-header > .toggle-btn');
    if(!back) return;
    const wrap = document.createElement('div'); wrap.className = 'calc-actions';
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'reset-btn'; btn.textContent = '↺ 重設 Reset';
    btn.title = 'Clear every entry in this calculator back to its starting value';
    btn.addEventListener('click', ()=>reset(c.id));
    back.before(wrap); wrap.append(btn, back);
  });
  return {reset};
})();

</script>
<script>
/* =========================================================
   APP SHELL (2026/09/30) — navigation layer only.
   • 依類型 (criteria / activity), 依疾病 (by disease) and 收藏 favourites.
   • Wraps showCalc()/goHome() so every tile, version tab and back
     button goes through browser history (phone back gesture works).
   • Favourites store calculator names only, in this browser.
========================================================= */
const APP = (function(){
  const GROUPS = [
    {key:'sle', zh:'紅斑性狼瘡',          en:'SLE',          kw:'狼瘡 紅斑 lupus 器官損傷 緩解 低疾病活動 damage remission t2t', ids:['g-sle','sledai','easybilag','g-t2t','sdi','clasi','lnpath']},
    {key:'sjd', zh:'乾燥症',              en:'Sjögren',      kw:'修格蘭 乾燥 sjogren sicca clinessdai star',         ids:['g-sjogren','essdai','esspri','cress']},
    {key:'ssc', zh:'全身性硬化症 / MCTD',  en:'SSc / MCTD',   kw:'硬皮症 混合結締組織 scleroderma',                    ids:['ssc2013','mrss','mctd']},
    {key:'iim', zh:'肌炎 + IPAF',         en:'IIM + IPAF',   kw:'肌炎 皮肌炎 抗合成酶 間質性肺病 myositis dermatomyositis ild', ids:['iim2017','assd2025','cdasi','mmt8','ipaf']},
    {key:'art', zh:'關節炎',              en:'Arthritis',    kw:'類風濕 關節炎 脊椎關節炎 僵直性 乾癬 痛風 超音波 水腫 ra spa psa gout rs3pe', ids:['acreular2010','das28','cdai','gloess','g-spa','ibp','basdai','asdas','caspar','dapsa','gout2015','rs3pe']},
    {key:'vas', zh:'血管炎（含 PMR）',     en:'Vasculitis',   kw:'血管炎 風濕性多肌痛 貝西氏 巨細胞 高安 冷凝球蛋白 vasculitis pmr', ids:['gpa2022','mpa2022','egpa2022','gca2022','tak2022','pmr2012','pan1990','cryovasc','g-iga','behcet','ffs','bvas']},
    {key:'oth', zh:'其他',                en:'Others',       kw:'抗磷脂 成人史笛爾 類肉瘤 aps still sarcoidosis',       ids:['g-aps','g-igg4','aosd','sarcoid']},
  ];
  const TYPES = [
    {cat:'criteria', zh:'分類／診斷標準', en:'Classification criteria', color:'var(--teal)'},
    {cat:'activity', zh:'疾病活動度',     en:'Disease activity scores', color:'var(--blue)'},
  ];
  const TAG = {criteria:'分類標準', activity:'疾病活動度'};
  const VIEWS = [
    ['type',    '依類型', 'By type',    'type'],
    ['disease', '依疾病', 'By disease', 'disease'],
    ['fav',     '收藏',   'Favorites',  'star'],
  ];
  const ICON = {
    type:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/>',
    disease:'<path d="M3 12h4l2.2-5.5 4.2 11 2.3-5.5H21"/>',
    star:'<path d="m12 3.2 2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6-4.5-4.2 6.1-.8z"/>',
    down:'<path d="M6 9l6 6 6-6"/>',
  };
  const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
  const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const $ = id => document.getElementById(id);

  /* ---------- catalogue ---------- */
  const ENTRIES = navEntries();
  const BY_ID = {}; ENTRIES.forEach(e=>BY_ID[e.id]=e);
  const GROUP_BY = {};
  GROUPS.forEach(g=>{ g.items=[]; g.ids.forEach(id=>{ if(BY_ID[id]){ g.items.push(BY_ID[id]); GROUP_BY[id]=g; } }); });
  const OTHER = GROUPS[GROUPS.length-1];
  ENTRIES.forEach(e=>{ if(!GROUP_BY[e.id]){ OTHER.items.push(e); GROUP_BY[e.id]=OTHER; } });   /* nothing can go missing */
  /* criteria before activity scores within each disease, otherwise registry order */
  GROUPS.forEach(g=>{ g.items = g.items.filter(e=>e.cat==='criteria').concat(g.items.filter(e=>e.cat!=='criteria')); });
  const ORDERED = GROUPS.flatMap(g=>g.items);
  ENTRIES.forEach(e=>{ const g=GROUP_BY[e.id]; e.appSearch = (e.search+' '+g.zh+' '+g.en+' '+g.kw+' '+TAG[e.cat]).toLowerCase(); });
  const entryOf = calcId => (GROUP_OF[calcId] ? GROUP_OF[calcId].id : calcId);
  const isValid = id => !!BY_ID[id] || CALCS.some(c=>c.id===id);

  /* ---------- storage (names only; works without it) ---------- */
  const mem = {};
  const store = {
    get(k,d){ try{ const v = localStorage.getItem(k); if(v!==null) return JSON.parse(v); }catch(e){} return k in mem ? mem[k] : d; },
    set(k,v){ mem[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  const FAV='rheumcalc.fav', LASTVIEW='rheumcalc.view';
  const favs = ()=> (store.get(FAV,[])||[]).filter(id=>BY_ID[id]);
  const isFav = id => favs().includes(id);
  function toggleFav(id){ const f=favs(); const i=f.indexOf(id); if(i>=0) f.splice(i,1); else f.push(id); store.set(FAV,f); }

  /* ---------- chrome: tabs, per-calculator star, result bar ---------- */
  $('topTabs').innerHTML = VIEWS.map(([v,zh,,ic])=>`<button type="button" data-go="${v}">${svg(ic)}${zh}</button>`).join('');
  document.body.insertAdjacentHTML('beforeend', `
    <nav class="tab-bar" aria-label="主要導覽">${VIEWS.map(([v,zh,,ic])=>`<button type="button" data-go="${v}">${svg(ic)}<span>${zh}</span></button>`).join('')}</nav>
    <button class="res-bar" type="button" hidden aria-label="捲動到完整結果"></button>`);
  CALCS.forEach(c=>{
    const acts = document.querySelector('#panel-'+c.id+' .calc-actions'); if(!acts) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'calc-fav'; b.dataset.fav = entryOf(c.id);
    b.innerHTML = svg('star')+'<span>收藏</span>';
    acts.prepend(b);
  });
  const bar = document.querySelector('.res-bar');

  /* ---------- list rendering ---------- */
  function row(e, showGroup){
    const g = GROUP_BY[e.id], on = isFav(e.id);
    return `<div class="row">
      <button class="row-open" type="button" data-open="${e.id}">
        <span class="row-main">
          <span class="row-nm">${esc(e.name)}</span>
          ${showGroup?`<span class="row-grp" style="color:var(--c-${g.key})">${esc(g.zh)}</span>`:''}
          <span class="row-ds">${esc(e.short)}</span>
        </span>
        <span class="row-tag ${e.cat}">${TAG[e.cat]}</span>
      </button>
      <button class="row-fav" type="button" data-fav="${e.id}" aria-pressed="${on}" aria-label="${on?'取消收藏':'加入收藏'}：${esc(e.name)}">${svg('star')}</button>
    </div>`;
  }
  const sec = (chip, color, title, items, showGroup) => `<section class="app-sec">
      <h3 class="app-sec-h"><span class="grp-chip" style="background:${color}">${esc(chip)}</span>${esc(title)}<span class="n">${items.length} 項</span></h3>
      <div class="rows">${items.map(e=>row(e,showGroup)).join('')}</div></section>`;
  function head(){
    const v = VIEWS.find(x=>x[0]===view);
    $('viewHead').innerHTML = v ? `<h2>${v[1]}</h2><span class="en">${v[2]}</span>` : '';
  }
  function renderList(){
    head();
    const q = $('searchInput').value.trim().toLowerCase();
    const toks = q ? q.split(/\s+/) : [];
    const hit = e => toks.every(t=>e.appSearch.includes(t));
    let html = '';
    if(view==='type'){
      html = TYPES.map(t=>{ const items = ORDERED.filter(e=>e.cat===t.cat && hit(e)); return items.length ? sec(t.en, t.color, t.zh, items, true) : ''; }).join('');
    } else {
      html = GROUPS.map(g=>{ const items = g.items.filter(hit); return items.length ? sec(g.en, `var(--c-${g.key})`, g.zh, items, false) : ''; }).join('');
    }
    $('homeList').innerHTML = html
      ? `<div class="grp-wrap">${html}</div>`
      : `<div class="empty">找不到符合「${esc(q)}」的計算器。<br>試試縮寫（如 <b>BVAS</b>）或疾病名（如 <b>血管炎</b>）。</div>`;
  }
  function renderFav(){
    head();
    const f = favs();
    $('homeList').innerHTML = f.length
      ? `<div class="rows">${f.map(id=>row(BY_ID[id], true)).join('')}</div>`
      : `<div class="empty">還沒有收藏。<br>點列表右側或計算器頁面上的 <b>☆ 收藏</b>，就會出現在這裡。</div>`;
  }
  function syncFav(){
    const f = favs();
    document.querySelectorAll('[data-fav]').forEach(b=>{
      const on = f.includes(b.dataset.fav);
      b.setAttribute('aria-pressed', on);
      if(b.classList.contains('calc-fav')){ b.querySelector('span').textContent = on ? '已收藏' : '收藏'; b.title = on ? '取消收藏' : '加入收藏'; }
    });
  }

  /* ---------- router (history-based; back gesture works) ---------- */
  let view = null, lastList = store.get(LASTVIEW,'type'), idx = 0, rendering = false, lastKey = '';
  if(!VIEWS.some(v=>v[0]===lastList)) lastList = 'type';
  const scrollMem = {};
  function parse(){
    const [v,id] = location.hash.replace(/^#\/?/,'').split('/');
    if(v==='calc' && id && isValid(id)) return {v:'calc', id};
    if(VIEWS.some(x=>x[0]===v)) return {v};
    return {v:lastList};
  }
  function go(path, replace){
    const h = '#/'+path;
    try{
      if(replace) history.replaceState({app:1, i:idx}, '', h);
      else { idx++; history.pushState({app:1, i:idx}, '', h); }
      render();
    }catch(e){ if(location.hash===h) render(); else location.hash = h; }
  }
  function render(){
    if(history.state && history.state.app) idx = history.state.i;
    const r = parse();
    const key = r.v+'/'+(r.id||'');
    if(view && view!=='calc') scrollMem[view] = window.scrollY;
    rendering = true;
    try{
      if(r.v==='calc'){ ORIG_SHOW(r.id); view = 'calc'; }
      else{
        if(activeId) ORIG_HOME();
        view = lastList = r.v; store.set(LASTVIEW, view);
        if(view==='fav') renderFav(); else renderList();
      }
    }finally{ rendering = false; }
    lastKey = key;
    document.body.dataset.view = view;
    updateChrome();
    if(view!=='calc'){ const y = scrollMem[view] || 0; requestAnimationFrame(()=>window.scrollTo(0, y)); }
    schedule();
  }
  function updateChrome(){
    const cur = view==='calc' ? lastList : view;
    document.querySelectorAll('[data-go]').forEach(b=>{ if(b.dataset.go===cur) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
    syncFav();
    if(view==='calc'){ const e = BY_ID[entryOf(activeId)]; document.title = (e?e.name:activeId)+' — RheumCalc'; }
    else document.title = 'RheumCalc — Rheumatology Clinical Calculators';
  }
  function back(){
    if(history.state && history.state.app && history.state.i > 0) history.back();
    else go(lastList, true);
  }

  /* Wrap the original navigation so every existing link / version tab / back button goes through the router */
  const ORIG_SHOW = showCalc, ORIG_HOME = goHome;
  showCalc = function(id){
    if(rendering) return ORIG_SHOW(id);
    const grp = CALC_GROUPS.find(g=>g.id===id); if(grp) id = grp.last;
    const sameGroup = view==='calc' && activeId && GROUP_OF[id] && GROUP_OF[activeId]===GROUP_OF[id];
    go('calc/'+id, sameGroup);            /* version-tab switch replaces, so Back returns to the list */
  };
  goHome = function(){ if(rendering) return ORIG_HOME(); back(); };

  /* ---------- events ---------- */
  document.addEventListener('click', ev=>{
    const f = ev.target.closest('[data-fav]');
    if(f){ ev.preventDefault(); toggleFav(f.dataset.fav); syncFav(); if(view==='fav') renderFav(); return; }
    const o = ev.target.closest('[data-open]');
    if(o){ ev.preventDefault(); showCalc(o.dataset.open); return; }
    const g = ev.target.closest('[data-go]');
    if(g){
      ev.preventDefault();
      if(g.dataset.go===view){ window.scrollTo({top:0, behavior:'smooth'}); return; }
      go(g.dataset.go);
    }
  });
  $('searchInput').addEventListener('input', ()=>{ if(view==='type' || view==='disease') renderList(); });
  window.addEventListener('popstate', render);
  window.addEventListener('hashchange', ()=>{ const r = parse(); if(r.v+'/'+(r.id||'') !== lastKey) render(); });

  /* ---------- floating result bar (read-only copy of the calculator's own result box) ---------- */
  const visible = el => !!(el && el.getClientRects().length && getComputedStyle(el).visibility!=='hidden');
  let target = null, targetOnScreen = false, raf = 0;
  const io = ('IntersectionObserver' in window) ? new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.target===target){ targetOnScreen = e.isIntersecting; bar.classList.toggle('off', targetOnScreen); } });
  }, {rootMargin:'0px 0px -120px 0px'}) : null;
  function currentResult(){
    if(view!=='calc' || !activeId) return null;
    const panel = $('panel-'+activeId); if(!panel) return null;
    return Array.from(panel.querySelectorAll('.result')).find(visible) || null;
  }
  function refreshBar(){
    raf = 0;
    const res = currentResult();
    if(res !== target){
      if(io && target) io.unobserve(target);
      target = res; targetOnScreen = false; bar.classList.remove('off');
      if(io && target) io.observe(target);
    }
    if(!res){ bar.hidden = true; return; }
    const scores = Array.from(res.querySelectorAll('.score')).filter(visible).slice(0,2).map(s=>{
      const c = s.cloneNode(true); const sm = c.querySelector('small'); const lab = sm ? sm.textContent.trim() : '';
      if(sm) sm.remove();
      return {num:c.textContent.trim(), lab};
    }).filter(s=>s.num!=='');
    const pills = Array.from(res.querySelectorAll('.pill')).filter(visible);   /* e.g. CRESS + STAR, CLASI activity + damage */
    const pill = pills[0];
    if(!scores.length && !pill){ bar.hidden = true; return; }
    const tone = pill ? (['green','yellow','orange','red'].find(t=>pill.classList.contains(t)) || '') : '';
    bar.className = 'res-bar ' + tone + (targetOnScreen ? ' off' : '');
    bar.innerHTML = `${scores.length ? `<span class="rb-scores">${scores.map(s=>`<span class="rb-s"><span class="rb-num">${esc(s.num)}</span>${s.lab?`<span class="rb-lab">${esc(s.lab)}</span>`:''}</span>`).join('')}</span>` : ''}
      <span class="rb-pill">${esc(pills.map(p=>p.textContent.trim()).join(' · '))}</span>
      <span class="rb-go">${svg('down')}<span>詳細</span></span>`;
    bar.hidden = false;
  }
  function schedule(){ if(!raf) raf = requestAnimationFrame(refreshBar); }
  new MutationObserver(()=>{ if(view==='calc') schedule(); })
    .observe($('panels'), {subtree:true, childList:true, characterData:true, attributes:true, attributeFilter:['class','style']});
  ['input','change','click'].forEach(t=>document.addEventListener(t, ()=>{ if(view==='calc') schedule(); }, true));
  window.addEventListener('resize', schedule);
  bar.addEventListener('click', ()=>{ if(target) target.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'center'}); });

  /* ---------- start ---------- */
  try{ history.replaceState({app:1, i:0}, '', location.hash || '#/'+lastList); }catch(e){}
  render();
  return {go, back, GROUPS};
})();
</script>
